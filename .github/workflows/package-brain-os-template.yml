name: Package Brain OS Template

on:
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build deploy-ready template
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package Brain-OS-V1-Template.zip
          mkdir -p package
          cp -a brain-os/template/. package/
          cp brain-os/requirements-documents.txt package/requirements-documents.txt
          cat > package/INSTALL_BRAIN_OS.md <<'EOF'
          # Brain OS V1 — Deploy Template

          Source branch: `brain-os-v1`
          Source commit: `f49256a2b26cc256252f481a19392d2899ab7a07`
          Functional gates: 0–10 PASS.

          ## Cách cài vào một Brain hiện có

          1. Backup Brain hiện tại.
          2. Giải nén **nội dung** ZIP này trực tiếp vào root của Brain.
             - `System/...` -> `<Brain>/System/...`
             - `skills/...` -> `<Brain>/skills/...`
             - `Javis/...` -> `<Brain>/Javis/...`
          3. Không tạo thêm lớp `brain-os/template/` trong Brain.
          4. Từ root Brain, chạy:

             ```bash
             python skills/brain-manager/scripts/brain_os.py doctor
             python skills/brain-manager/scripts/brain_os.py scan
             ```

          5. Brain Watch mặc định **tắt** (`enabled: false`). Chỉ bật `Javis/loops/brain-watch.md` sau khi doctor/scan ổn.

          ## PDF

          Chỉ PDF cần dependency bổ sung. Cài **một lần** trong Python environment chạy Javis:

          ```bash
          pip install -r requirements-documents.txt
          ```

          DOCX/XLSX/CSV/TSV dùng parser deterministic không cần dependency này.

          ## Mặc định an toàn

          - `System/BrainOS/config.yml` giữ `dry_run: true`.
          - Không auto-create folder/tag.
          - Không auto-move note.
          - Brain Watch disabled by default.
          - `.javis/` sẽ được Brain OS tự tạo khi chạy; ZIP không chứa state cá nhân.
          EOF

          cat > package/PACKAGE_INFO.txt <<'EOF'
          Brain OS V1 deploy-ready template
          Source: quoctran-2608/javis-os
          Branch: brain-os-v1
          Commit: f49256a2b26cc256252f481a19392d2899ab7a07
          Gates: 0-10 PASS
          Layout: extract contents directly into a Brain root
          Brain Watch: disabled by default
          Global dry_run: true
          EOF

          (cd package && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd package && zip -q -r ../Brain-OS-V1-Template.zip .)
          unzip -t Brain-OS-V1-Template.zip
          echo "ZIP_CONTENTS"
          unzip -Z1 Brain-OS-V1-Template.zip | sort

      - name: Upload deploy ZIP
        uses: actions/upload-artifact@v4
        with:
          name: brain-os-v1-deploy-template
          path: Brain-OS-V1-Template.zip
          if-no-files-found: error
          retention-days: 7
