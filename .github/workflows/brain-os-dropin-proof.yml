name: Brain OS Arbitrary Brain Drop-in Proof

on:
  push:
    branches: [ brain-os-v1 ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r brain-os/template/requirements-brain-os.txt
          python -m pip install pytest

      - name: Compile Javis and Brain OS
        run: |
          python -m compileall -q server system/plugins brain-os/template/skills/brain-manager/scripts brain-os/install_brain_os.py

      - name: Import actual Javis server main
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd server
          python -c "import main; print(f'ok, loaded main with {len(main.app.routes)} routes')"

      - name: Prove arbitrary-brain bridge and safe installer
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pytest -q \
            brain-os/tests/test_javis_dropin_integration.py \
            brain-os/tests/test_brain_os_installer.py

      - name: Re-run canonical Brain OS and Javis integrations
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pytest -q \
            brain-os/tests/test_foundation.py \
            brain-os/tests/test_core_stage2.py \
            brain-os/tests/test_stage3_scanner.py \
            brain-os/tests/test_stage3_identity_edges.py \
            brain-os/tests/test_stage4_classifier.py \
            brain-os/tests/test_stage5_taxonomy.py \
            brain-os/tests/test_stage6_importer.py \
            brain-os/tests/test_stage6_cli.py \
            brain-os/tests/test_stage6_reimport_edges.py \
            brain-os/tests/test_stage7_amplenote.py \
            brain-os/tests/test_stage8_brain_manager.py \
            brain-os/tests/test_stage9_brain_watch.py \
            brain-os/tests/test_stage10_documents.py \
            brain-os/tests/test_javis_ingest_integration.py \
            brain-os/tests/test_javis_notes_integration.py \
            brain-os/tests/test_javis_query_wiki_integration.py \
            brain-os/tests/test_javis_lint_wiki_integration.py \
            brain-os/tests/test_template_packaging.py \
            brain-os/tests/test_hardening_identity_recovery.py \
            brain-os/tests/test_hardening_db_recovery.py \
            brain-os/tests/test_hardening_pilot_readiness.py \
            brain-os/tests/test_hardening_scale.py

      - name: Contract assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.')
          assert (root/'system/plugins/brain-os/plugin.py').is_file()
          assert 'pypdf' in (root/'requirements.txt').read_text(encoding='utf-8').lower()
          for slug in ('ingest-source','notes','query-wiki','lint-wiki'):
              app = (root/'.claude/skills'/slug/'SKILL.md').read_text(encoding='utf-8')
              can = (root/'brain-os/template/skills'/slug/'SKILL.md').read_text(encoding='utf-8')
              mir = (root/'brain-os/template/.claude/skills'/slug/'SKILL.md').read_text(encoding='utf-8')
              assert app == can == mir, slug
              assert 'javis_brain_os' in app
              assert 'python skills/brain-manager/scripts' not in app
          print('drop-in skill bridge contract: PASS')
          PY

      - name: Publish proof status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          state = os.environ['JOB_STATUS']
          if state == 'cancelled': state = 'error'
          if state not in {'success','failure','error'}: state = 'error'
          payload = json.dumps({
              'state': state,
              'context': 'brain-os/arbitrary-brain-dropin-proof',
              'description': 'Javis cwd/system_sync + safe installer + arbitrary Brain integration proof',
          }).encode('utf-8')
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/statuses/{sha}',
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(req) as resp:
              print(resp.status)
          PY
