name: Package Brain OS Integration Template

on:
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Brain OS deploy dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r brain-os/template/requirements-brain-os.txt
          python -m pip install pytest

      - name: Compile Brain OS
        run: python -m compileall -q brain-os/template/skills/brain-manager/scripts

      - name: Canonical Gates plus Javis integrations and packaging invariants
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pytest -q \
            brain-os/tests/test_foundation.py \
            brain-os/tests/test_core_stage2.py \
            brain-os/tests/test_stage3_scanner.py \
            brain-os/tests/test_stage3_identity_edges.py \
            brain-os/tests/test_stage4_classifier.py \
            brain-os/tests/test_stage5_taxonomy.py \
            brain-os/tests/test_stage6_importer.py \
            brain-os/tests/test_stage6_cli.py \
            brain-os/tests/test_stage6_reimport_edges.py \
            brain-os/tests/test_stage7_amplenote.py \
            brain-os/tests/test_stage8_brain_manager.py \
            brain-os/tests/test_stage9_brain_watch.py \
            brain-os/tests/test_stage10_documents.py \
            brain-os/tests/test_javis_ingest_integration.py \
            brain-os/tests/test_javis_notes_integration.py \
            brain-os/tests/test_javis_query_wiki_integration.py \
            brain-os/tests/test_javis_lint_wiki_integration.py \
            brain-os/tests/test_template_packaging.py

      - name: Build deploy root
        run: |
          mkdir package
          cp -a brain-os/template/. package/
          test -f package/.claude/skills/ingest-source/SKILL.md
          test -f package/.claude/skills/notes/SKILL.md
          test -f package/.claude/skills/query-wiki/SKILL.md
          test -f package/.claude/skills/lint-wiki/SKILL.md
          test -f package/requirements-brain-os.txt
          test ! -e package/.javis

      - name: Doctor copied package
        working-directory: package
        run: |
          python skills/brain-manager/scripts/brain_os.py doctor
          python -m compileall -q skills/brain-manager/scripts

      - name: Create direct-overwrite ZIP
        run: |
          (cd package && zip -qr ../Brain-OS-V1-Integration.zip .)
          sha256sum Brain-OS-V1-Integration.zip > Brain-OS-V1-Integration.zip.sha256
          unzip -t Brain-OS-V1-Integration.zip

      - uses: actions/upload-artifact@v4
        with:
          name: brain-os-v1-integration-template
          path: |
            Brain-OS-V1-Integration.zip
            Brain-OS-V1-Integration.zip.sha256
          if-no-files-found: error
