name: Brain OS Python Regression Diagnostic

on:
  push:
    branches: [ brain-os-v1 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-shard:
    name: python-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Javis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run deterministic Python test shard
        env:
          PYTHONIOENCODING: utf-8
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path

          shard = int(os.environ['SHARD'])
          files = sorted(Path('tests/python').glob('test_*.py'))
          selected = [p for i, p in enumerate(files) if i % 8 == shard]
          print(f'shard={shard} files={len(selected)}')
          failed = []
          for path in selected:
              print(f'==== {path.name} ====', flush=True)
              rc = subprocess.run([sys.executable, str(path)]).returncode
              if rc:
                  failed.append(path.name)
          if failed:
              print('FAILED FILES:', ', '.join(failed), flush=True)
              raise SystemExit(1)
          PY
