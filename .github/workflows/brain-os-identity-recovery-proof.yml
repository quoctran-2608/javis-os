name: Brain OS Identity Recovery Proof

on:
  push:
    branches: [ brain-os-v1 ]

permissions:
  contents: read
  statuses: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Brain OS proof dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r brain-os/template/requirements-brain-os.txt
          python -m pip install pytest

      - name: Compile Brain OS
        run: python -m compileall -q brain-os/template/skills/brain-manager/scripts

      - name: Canonical Gates, integrations, packaging, recovery hardening
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pytest -q \
            brain-os/tests/test_foundation.py \
            brain-os/tests/test_core_stage2.py \
            brain-os/tests/test_stage3_scanner.py \
            brain-os/tests/test_stage3_identity_edges.py \
            brain-os/tests/test_stage4_classifier.py \
            brain-os/tests/test_stage5_taxonomy.py \
            brain-os/tests/test_stage6_importer.py \
            brain-os/tests/test_stage6_cli.py \
            brain-os/tests/test_stage6_reimport_edges.py \
            brain-os/tests/test_stage7_amplenote.py \
            brain-os/tests/test_stage8_brain_manager.py \
            brain-os/tests/test_stage9_brain_watch.py \
            brain-os/tests/test_stage10_documents.py \
            brain-os/tests/test_javis_ingest_integration.py \
            brain-os/tests/test_javis_notes_integration.py \
            brain-os/tests/test_javis_query_wiki_integration.py \
            brain-os/tests/test_javis_lint_wiki_integration.py \
            brain-os/tests/test_template_packaging.py \
            brain-os/tests/test_hardening_identity_recovery.py

      - name: Verify deploy template remains state-free
        run: |
          test -f brain-os/template/skills/brain-manager/scripts/brain_identity.py
          test -f brain-os/template/requirements-brain-os.txt
          test ! -e brain-os/template/.javis

      - name: Publish proof status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" = "cancelled" ]; then state="error"; fi
          if [ "$state" != "success" ] && [ "$state" != "failure" ] && [ "$state" != "error" ]; then state="error"; fi
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          state = os.environ['JOB_STATUS']
          if state == 'cancelled':
              state = 'error'
          if state not in {'success','failure','error'}:
              state = 'error'
          payload = json.dumps({
              'state': state,
              'context': 'brain-os/identity-recovery-proof',
              'description': 'Canonical Brain OS + integration + recovery hardening proof',
          }).encode('utf-8')
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/statuses/{sha}',
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(req) as resp:
              print(resp.status)
          PY
