name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # Chạy tay từ tab Actions. Cần vì có một khe hở thật: đẩy commit lên một nhánh CHƯA có PR mở
  # thì không sự kiện nào bắt (push chỉ nghe `main`), và mở PR sau đó có lúc GitHub không sinh
  # run cho commit đã nằm sẵn ở đó. Lúc ấy không có cách nào bắt CI chạy ngoài việc đẩy thêm
  # một commit rác. Có nút chạy tay thì hết phải làm vậy.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest KHÔNG phải dependency của app nên không nằm trong requirements.txt.
          # Nhóm test Adaptive Runtime viết theo kiểu pytest (fixture tmp_path/monkeypatch);
          # thiếu pytest thì block __main__ của chúng tự bỏ qua và cả trăm test "xanh" mà
          # chưa chạy assertion nào.
          pip install pytest

      - name: Byte-compile toàn bộ server + plugin
        run: python -m compileall -q server system/plugins

      # Byte-compile KHÔNG chạy code nên không thấy vòng import bị gãy. Server có 3 vòng
      # đang được phá bằng import trong hàm (config<->secrets_store, oauth_mcp<->mcp_store,
      # claude_cli<->claude_sdk_engine) cộng 8 module nữa dựa vào mẹo đó. Nâng nhầm một
      # import lên đầu file là app chết lúc khởi động chứ không phải lúc build, mà CI cũ
      # vẫn xanh rồi tự deploy lên VPS. Bước này đóng đúng khe hở đó.
      - name: Import thật main (bắt vòng import mà byte-compile bỏ lọt)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd server
          python -c "import main; print(f'ok, nap duoc main voi {len(main.app.routes)} muc route')"

      # Trước 0.9.242 chỉ 4 trong 11 test JS được liệt tay ở đây, 7 cái còn lại chưa từng
      # chạy lần nào. Nay quét cả thư mục nên thêm test mới là tự chạy.
      - name: Chạy test JS dashboard
        run: |
          status=0
          for f in tests/js/test_*.js tests/js/test_*.mjs; do
            echo "==== $(basename "$f") ===="
            node "$f" || status=1
          done
          exit $status

      # KHÔNG còn `cd server`: từ 0.9.242 test tự nạp đường dẫn qua tests/python/_paths.py
      # nên chạy được từ bất kỳ thư mục làm việc nào. Trước đây chạy sai chỗ là hàng loạt
      # test đỏ vì `import main` không thấy module, hoặc lặng lẽ đọc nhầm file.
      - name: Chạy test Python (auth/secret/MCP-perm/traversal/CSRF + plugin)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          status=0
          for f in tests/python/test_*.py; do
            echo "==== $(basename "$f") ===="
            python "$f" || status=1
          done
          exit $status

      # Brain OS có regression suite riêng cho identity, scanner, taxonomy, import,
      # Amplenote, documents, Javis bridge, recovery, pilot readiness và portable installer.
      - name: Chạy Brain OS regression tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q brain-os/tests

  # Release proof phải bắt đầu từ runner sạch, cài đúng dependency runtime rồi dùng
  # installer CLI thật. Chạy cả Linux và Windows vì Javis desktop/runtime thực tế có
  # người dùng Windows; nhờ vậy lỗi path/encoding/subprocess không thể ẩn sau Ubuntu CI.
  release-hardening:
    name: Release hardening (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fresh install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify Brain OS runtime dependencies import
        env:
          PYTHONIOENCODING: utf-8
        run: python -c "import pypdf, yaml; print('brain-os runtime dependencies import ok')"

      - name: Clean drop-in installer + bridge + ingest E2E
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q brain-os/tests/test_release_dropin_e2e.py

      # Đây là đúng đường người dùng sẽ làm ở lần test cuối: ZIP nằm trong Brain mới, giải nén
      # thành .brain-os-installer (ẩn khỏi scanner), chạy không truyền Brain path/Javis root,
      # preview -> apply -> verify; checksum tamper phải fail trước mọi target write.
      - name: Portable ZIP inside fresh Brain E2E
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q brain-os/tests/test_portable_package.py

      - name: Cross-platform document regression
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q brain-os/tests/test_stage10_documents.py

  # Chỉ sinh artifact sau khi cả test tổng và 2 runner release-hardening đều xanh. Artifact này
  # là package ứng viên; khi chốt HEAD cuối có thể lấy đúng ZIP của run đó để test trên Brain thật.
  portable-package:
    name: Build portable installer artifact
    needs: [test, release-hardening]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build deterministic portable ZIP
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python brain-os/tools/build_portable_package.py \
            --output-dir dist \
            --source-sha "$SOURCE_SHA" \
            --compact

      - name: Inspect portable ZIP contract
        run: |
          python -c "import zipfile; z=zipfile.ZipFile('dist/BrainOS-V1-Portable.zip'); names=set(z.namelist()); assert '.brain-os-installer/install.py' in names; assert '.brain-os-installer/manifest.json' in names; assert '.brain-os-installer/checksums.sha256' in names; assert '.brain-os-installer/payload/System/BrainOS/config.yml' in names; assert all(n.startswith('.brain-os-installer/') for n in names); assert not any('/.javis/' in n or '/.claude/' in n for n in names); print('hidden portable package contract ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: brain-os-v1-portable
          path: dist/BrainOS-V1-Portable.zip
          if-no-files-found: error
          retention-days: 14
