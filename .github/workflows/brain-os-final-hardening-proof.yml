name: Brain OS Final Hardening Proof

on:
  push:
    branches: [ brain-os-v1 ]

permissions:
  contents: read
  statuses: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all proof dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r brain-os/template/requirements-brain-os.txt
          python -m pip install pytest

      - name: Compile Javis and Brain OS
        run: |
          python -m compileall -q server system/plugins
          python -m compileall -q brain-os/template/skills/brain-manager/scripts

      - name: Import real Javis server main
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd server
          python -c "import main; print(f'ok, loaded main with {len(main.app.routes)} routes')"

      - name: Run all dashboard JS tests
        run: |
          status=0
          for f in tests/js/test_*.js tests/js/test_*.mjs; do
            echo "==== $(basename "$f") ===="
            node "$f" || status=1
          done
          exit $status

      - name: Run all Javis Python tests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          status=0
          for f in tests/python/test_*.py; do
            echo "==== $(basename "$f") ===="
            python "$f" || status=1
          done
          exit $status

      - name: Run canonical Brain OS plus all integration and hardening tests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pytest -q \
            brain-os/tests/test_foundation.py \
            brain-os/tests/test_core_stage2.py \
            brain-os/tests/test_stage3_scanner.py \
            brain-os/tests/test_stage3_identity_edges.py \
            brain-os/tests/test_stage4_classifier.py \
            brain-os/tests/test_stage5_taxonomy.py \
            brain-os/tests/test_stage6_importer.py \
            brain-os/tests/test_stage6_cli.py \
            brain-os/tests/test_stage6_reimport_edges.py \
            brain-os/tests/test_stage7_amplenote.py \
            brain-os/tests/test_stage8_brain_manager.py \
            brain-os/tests/test_stage9_brain_watch.py \
            brain-os/tests/test_stage10_documents.py \
            brain-os/tests/test_javis_ingest_integration.py \
            brain-os/tests/test_javis_notes_integration.py \
            brain-os/tests/test_javis_query_wiki_integration.py \
            brain-os/tests/test_javis_lint_wiki_integration.py \
            brain-os/tests/test_template_packaging.py \
            brain-os/tests/test_hardening_identity_recovery.py \
            brain-os/tests/test_hardening_db_recovery.py \
            brain-os/tests/test_hardening_pilot_readiness.py \
            brain-os/tests/test_hardening_scale.py

      - name: Build and verify deploy root
        run: |
          mkdir package
          cp -a brain-os/template/. package/
          test ! -e package/.javis
          test -f package/System/BrainOS/recovery-runbook.md
          test -f package/skills/brain-manager/scripts/brain_recovery.py
          test -f package/skills/brain-manager/scripts/brain_pilot.py
          for s in ingest-source notes query-wiki lint-wiki; do
            test -f "package/skills/$s/SKILL.md"
            test -f "package/.claude/skills/$s/SKILL.md"
            cmp "package/skills/$s/SKILL.md" "package/.claude/skills/$s/SKILL.md"
          done

      - name: Verify canonical Javis skill resolution in copied deploy root
        run: |
          PYTHONPATH=server python - <<'PY'
          from pathlib import Path
          import skill_router
          root = Path('package').resolve()
          for slug in ('ingest-source','notes','query-wiki','lint-wiki'):
              p = skill_router.resolve_skill_file(root, slug)
              assert p is not None, slug
              rel = p.relative_to(root).as_posix()
              assert rel == f'skills/{slug}/SKILL.md', (slug, rel)
              assert 'Brain OS' in p.read_text(encoding='utf-8')
          print('canonical skill resolution: PASS')
          PY

      - name: Doctor copied package
        working-directory: package
        run: |
          python skills/brain-manager/scripts/brain_os.py doctor
          python -m compileall -q skills/brain-manager/scripts

      - name: Publish final proof status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          state = os.environ['JOB_STATUS']
          if state == 'cancelled': state = 'error'
          if state not in {'success','failure','error'}: state = 'error'
          payload = json.dumps({
              'state': state,
              'context': 'brain-os/final-hardening-proof',
              'description': 'Normal Javis + Brain OS Gate 0-10 + integrations + hardening + scale',
          }).encode('utf-8')
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/statuses/{sha}',
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(req) as resp: print(resp.status)
          PY
